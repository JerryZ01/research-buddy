[project]
name = "research-buddy"
version = "0.3.0"
description = "基于 LangGraph + Langfuse 的深度研究 Agent"
requires-python = ">=3.11"
dependencies = [
    # stream_mode 传 list 才会 yield (mode, payload)，且 nodes 依赖 langgraph.types
    # 的 StreamWriter / Command，下限按实际验证过的 1.x 写
    "langgraph>=1.0",
    "langchain-openai>=0.3",
    # 代码用的是 langfuse.langchain.CallbackHandler、get_client()、
    # start_as_current_observation()，这些都是 v4 才有的路径；
    # 之前写 >=2.0 会解析到一个 import 就失败的版本
    "langfuse>=4.0,<5",
    "tavily-python>=0.5",
    "python-dotenv>=1.0",
    "langchain>=1.3.11",
    "langchain-community>=0.4.2",
    "fastapi>=0.139.0",
    "uvicorn>=0.50.0",
    "sse-starlette>=3.4.5",
    "httpx>=0.28.1",
    "chromadb>=1.5.9",
    "onnxruntime>=1.18.0",
    "apscheduler>=3.11.3",
]

[project.optional-dependencies]
# 本地多语言 embedding（中文语义检索）。会拉入 torch，安装体积显著变大，
# 所以做成可选：uv sync --extra multilingual，并设 EMBEDDING_BACKEND=sentence-transformers
multilingual = [
    "sentence-transformers>=3.0",
]

[project.scripts]
research-buddy = "research_buddy:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/research_buddy"]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
